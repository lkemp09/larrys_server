<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Altitude Indicator</title>
    <link rel="stylesheet" href="/projects/altitude-indicator/styles.css">
  </head>
  <body>
    <main class="flight-deck">
      <section class="instrument-workspace" aria-label="Animated aviation altitude indicator">
        <header class="display-panel">
          <div>
            <p class="eyebrow">Pointer-controlled avionics</p>
            <h1>Altitude Indicator</h1>
          </div>
          <a class="nav-link" href="/">Menu</a>
        </header>

        <div class="altimeter" id="altimeter">
          <div class="bezel">
            <div class="glass">
              <div class="skyline"></div>
              <div class="dial">
                <div class="tick-ring" aria-hidden="true"></div>
                <ol class="numbers" aria-hidden="true">
                  <li style="--index: 0"><span>0</span></li>
                  <li style="--index: 1"><span>1</span></li>
                  <li style="--index: 2"><span>2</span></li>
                  <li style="--index: 3"><span>3</span></li>
                  <li style="--index: 4"><span>4</span></li>
                  <li style="--index: 5"><span>5</span></li>
                  <li style="--index: 6"><span>6</span></li>
                  <li style="--index: 7"><span>7</span></li>
                  <li style="--index: 8"><span>8</span></li>
                  <li style="--index: 9"><span>9</span></li>
                </ol>

                <div class="altitude-window" aria-label="Altitude readout">
                  <span id="altitudeReadout">00000</span>
                  <small>FT</small>
                </div>

                <div class="baro-window">
                  <span id="baroReadout">29.92</span>
                  <small>IN HG</small>
                </div>

                <div class="needle ten-thousand" aria-hidden="true"></div>
                <div class="needle thousand" aria-hidden="true"></div>
                <div class="needle hundred" aria-hidden="true"></div>
                <div class="hub" aria-hidden="true"></div>
              </div>
            </div>
          </div>

          <div class="status-strip">
            <output id="targetReadout" aria-live="polite">0 ft</output>
            <span>Move across the panel</span>
            <output id="climbReadout">0 fpm</output>
          </div>
        </div>
      </section>
    </main>

    <script src="/projects/altitude-indicator/script.js"></script>
  </body>
</html>
