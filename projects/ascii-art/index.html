<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASCII Art</title>
    <link rel="stylesheet" href="/projects/ascii-art/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="ascii-workspace" aria-label="ASCII art generator">
        <header class="display-panel">
          <div>
            <p class="eyebrow">Text renderer</p>
            <h1>ASCII Art</h1>
          </div>
          <a class="back-link" href="/">Menu</a>
        </header>

        <div class="controls">
          <label class="field text-field">
            <span>Text</span>
            <input id="textInput" type="text" autocomplete="off" spellcheck="false" value="Hello">
          </label>

          <label class="field font-field">
            <span>Font</span>
            <select id="fontSelect"></select>
          </label>
        </div>

        <pre id="asciiOutput" class="ascii-output" aria-live="polite"></pre>
      </section>
    </main>

    <script src="/projects/ascii-art/script.js"></script>
  </body>
</html>
