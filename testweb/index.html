<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple 2 Bedroom House Design</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="house-page" aria-label="Small two bedroom simple house design">
      <section class="design-board">
        <div class="elevation" aria-label="Front elevation rendering">
          <div class="sky"></div>
          <div class="house">
            <div class="roof roof-main"></div>
            <div class="roof roof-porch"></div>
            <div class="siding"></div>
            <div class="window window-left"><span></span></div>
            <div class="door"></div>
            <div class="window window-right"><span></span></div>
            <div class="porch"></div>
            <div class="steps"></div>
          </div>
          <div class="ground"></div>
        </div>

        <div class="plan-wrap">
          <header class="plan-header">
            <p>Small 2 Bedroom Simple House</p>
            <h1>Compact 26' x 34' Layout</h1>
          </header>

          <svg class="floor-plan" viewBox="0 0 520 680" role="img" aria-label="Floor plan for a two bedroom one bathroom simple house">
            <defs>
              <pattern id="deckBoards" width="18" height="18" patternUnits="userSpaceOnUse">
                <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#b98f65" stroke-width="1.4"/>
              </pattern>
              <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 Z" fill="#24353f"/>
              </marker>
            </defs>

            <rect x="36" y="36" width="448" height="584" rx="2" class="slab"/>
            <rect x="54" y="54" width="412" height="548" class="outer-wall"/>

            <rect x="54" y="54" width="412" height="170" class="living-zone"/>
            <rect x="54" y="224" width="196" height="184" class="bed-zone"/>
            <rect x="250" y="224" width="216" height="184" class="bed-zone alt"/>
            <rect x="54" y="408" width="176" height="194" class="service-zone"/>
            <rect x="230" y="408" width="236" height="194" class="kitchen-zone"/>

            <path d="M54 224 H466 M250 224 V408 M54 408 H466 M230 408 V602" class="interior-wall"/>
            <path d="M250 224 V294 M250 344 V408 M230 408 V472 M230 526 V602" class="interior-wall cut"/>

            <path d="M226 224 A54 54 0 0 1 172 278" class="door-swing"/>
            <path d="M274 408 A54 54 0 0 0 328 354" class="door-swing"/>
            <path d="M230 472 A48 48 0 0 1 182 520" class="door-swing"/>

            <rect x="158" y="48" width="96" height="12" class="window-plan"/>
            <rect x="318" y="48" width="96" height="12" class="window-plan"/>
            <rect x="48" y="274" width="12" height="78" class="window-plan"/>
            <rect x="460" y="274" width="12" height="78" class="window-plan"/>
            <rect x="324" y="596" width="68" height="12" class="entry-door"/>

            <rect x="312" y="602" width="92" height="48" class="porch-plan"/>
            <rect x="312" y="602" width="92" height="48" fill="url(#deckBoards)" opacity="0.7"/>

            <text x="260" y="122" class="room-title">Living / Dining</text>
            <text x="260" y="150" class="room-note">open front room</text>

            <text x="152" y="314" class="room-title">Bedroom 1</text>
            <text x="152" y="342" class="room-note">10' x 12'</text>

            <text x="358" y="314" class="room-title">Bedroom 2</text>
            <text x="358" y="342" class="room-note">10' x 12'</text>

            <text x="142" y="492" class="room-title">Bath / Laundry</text>
            <text x="142" y="520" class="room-note">shared wet wall</text>

            <text x="348" y="492" class="room-title">Kitchen</text>
            <text x="348" y="520" class="room-note">rear entry porch</text>

            <line x1="54" y1="638" x2="466" y2="638" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="260" y="664" class="dimension-text">26'</text>
            <line x1="14" y1="54" x2="14" y2="602" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="14" y="334" class="dimension-text rotate">34'</text>
          </svg>
        </div>
      </section>
    </main>
  </body>
</html>
