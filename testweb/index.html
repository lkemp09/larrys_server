<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Larry's Playground</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="menu-shell">
      <section class="playground-menu" aria-label="Larry's Playground page menu">
        <header class="menu-header">
          <p class="eyebrow">Choose an experiment</p>
          <h1>Larry's Playground</h1>
        </header>

        <nav class="page-grid" aria-label="Playground pages">
          <a class="page-card abacus-card" href="/abacus/">
            <span class="card-kicker">Calculator</span>
            <strong>Abacus</strong>
            <span>Interactive bead calculator with live numeric readout.</span>
          </a>

          <div class="page-card ascii-card">
            <a class="corner-link" href="https://www.yahoo.com/">Terminal Style</a>
            <a class="card-title-link" href="/ascii-art/">ASCII Art</a>
            <span>Turn text into chunky display lettering.</span>
          </div>

          <a class="page-card altitude-card" href="/altitude-indicator/">
            <span class="card-kicker">Avionics</span>
            <strong>Altitude Indicator</strong>
            <span>Mouse-driven CSS altimeter with animated needles.</span>
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
